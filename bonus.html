</style></head><body><main class="stage"><h1>QUOTE CHALLENGE<br>BONUS ROUND!</h1><section class="card"><h2 id="title">Bonus Round</h2><p id="prompt"></p><form id="quiz" hidden><label for="man">Leading man</label><input id="man" autocomplete="off" required><label for="lady">Leading lady</label><input id="lady" autocomplete="off" required><button id="submit" type="submit">LOCK ANSWERS</button></form><p id="result" role="status" aria-live="polite"></p><p class="note" id="note"></p><a id="return" class="return" href="index.html">PRESS HERE TO RETURN</a></section></main><script>
'use strict';
const eggs={left:{title:'Psycho (1960)',man:['Anthony Perkins','Perkins'],lady:['Janet Leigh','Leigh'],points:10},right:{title:'The Sound of Music (1965)',man:['Christopher Plummer','Plummer'],lady:['Julie Andrews','Andrews'],points:10},popcorn:{title:'You found the popcorn!',points:5},portrait:{title:'You found the hidden portrait!',points:20}};
const params=new URLSearchParams(location.search),id=params.get('egg'),egg=eggs[id],key='qc_entrance_rewards_v1';let completed=false;
function readRewards(){try{const s=JSON.parse(localStorage.getItem(key)||'{}');return {total:Number(s.total)||0,claimed:s.claimed&&typeof s.claimed==='object'?s.claimed:{}}}catch{return {total:0,claimed:{}}}}
function award(){const s=readRewards();if(s.claimed[id])return {fresh:false,saved:true};s.claimed[id]=true;s.total+=egg.points;try{localStorage.setItem(key,JSON.stringify(s));return {fresh:true,saved:true}}catch{return {fresh:true,saved:false}}}
function celebrate(){const a=award();document.getElementById('result').textContent=a.fresh?'Congratulations, you have won '+egg.points+' points!':'You already collected these '+egg.points+' points. Congratulations on finding it again!';document.getElementById('note').textContent=a.saved?'Bonus points are saved in this browser. Each discovery pays once.':'Your browser could not save these points. Enable browser storage to keep rewards.';document.getElementById('quiz').hidden=true;completed=true}
function norm(v){return v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').trim().replace(/\s+/g,' ')}
if(egg){document.getElementById('title').textContent=egg.title;if(!egg.man||readRewards().claimed[id])celebrate();else{document.getElementById('prompt').textContent='Who are the leading man and leading lady in this movie? Get both right to win 10 points.';document.getElementById('quiz').hidden=false}}else{document.getElementById('prompt').textContent='A secret is waiting at the theater entrance.'}
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();if(completed||!egg?.man)return;const m=norm(document.getElementById('man').value),l=norm(document.getElementById('lady').value);if(egg.man.some(x=>norm(x)===m)&&egg.lady.some(x=>norm(x)===l))celebrate();else document.getElementById('result').textContent='Not quite—try those two names again.'});
</script></body></html>
