<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a3b">
  <title>Quote Challenge — Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(135deg, #0d1321 0%, #1e293b 50%, #020309 100%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body {
      min-height: 100vh;
      padding: 2rem;
    }
    .construction-container {
      text-align: center;
      max-width: 600px;
      padding: 3rem 2rem;
      border: 3px solid #ffe34d;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: #ffe34d;
      letter-spacing: 0.03em;
      font-weight: 900;
    }
    .emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 1.5rem;
      animation: bounce 2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    p {
      font-size: 1.1rem;
      color: #e5eefb;
      line-height: 1.6;
      margin: 1rem 0;
    }
    .highlight {
      color: #ffe34d;
      font-weight: 700;
    }
    .back-button {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 2rem;
      background: linear-gradient(135deg, #0755bd, #031c48);
      color: #ffe34d;
      border: 2px solid #ffe34d;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .back-button:hover {
      background: linear-gradient(135deg, #0a6fe8, #052060);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(7, 85, 189, 0.4);
    }
    .back-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <div class="construction-container">
    <span class="emoji">🎬</span>
    <h1>Under Construction</h1>
    <p>The Quote Challenge two-player game is <span class="highlight">coming soon</span>!</p>
    <p>We're building something amazing. Check back soon for the grand opening.</p>
    <a href="Index.html" class="back-button">← Back to Entrance</a>
  </div>
</body>
</html>
