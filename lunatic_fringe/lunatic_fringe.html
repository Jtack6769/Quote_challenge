<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Challenge Carousel</title>
    <style>
        /* 1. Center the carousel container on your page */
        .carousel {
            position: relative;
            width: 100%;
            max-width: 600px;  /* Adjust the layout width as needed */
            height: 400px;     /* Adjust the layout height as needed */
            margin: 40px auto;
            overflow: hidden;
            background-color: #f0f0f0;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        /* 2. Absolute positioning forces all images to layer directly on top of each other */
        .carousel img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Prevents image distortion */
            
            /* Hide images by default using zero opacity and add a smooth fade effect */
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* 3. This class handles displaying the active visible slide */
        .carousel img.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- This matches your exact repository structure, added the initial 'active' class -->
    <div class="carousel">
        <img src="image_6bd35da8.jpg" alt="Carousel Image 1" class="active">
        <img src="image_7e6db39.jpg" alt="Carousel Image 2">
        <img src="image_9eb11c73.jpg" alt="Carousel Image 3">
        <img src="image_eadaddeb.jpg" alt="Carousel Image 4">
    </div>

    <script>
        // Target all images located inside your carousel container
        const slides = document.querySelectorAll('.carousel img');
        let currentSlideIndex = 0;

        function cycleCarousel() {
            // Hide the image that is currently visible
            slides[currentSlideIndex].classList.remove('active');
            
            // Mathematically shift to the next slide, looping to 0 when reaching the end
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            
            // Make the new current image visible
            slides[currentSlideIndex].classList.add('active');
        }

        // Set the timer to trigger the animation function every 3000ms (3 seconds)
        setInterval(cycleCarousel, 3000);
    </script>

</body>
</html>
