# Upload this file as .github/workflows/running.yml on the default branch.
# Daily at 12:37 UTC, plus manual Run workflow; no push trigger.
# Reports: .github/workflows/Qc reports/daily-scanner/README.md
# Screenshots remain in the downloadable Actions artifact.
name: Quote Challenge Daily Scanner
'on':
  workflow_dispatch: null
  schedule:
  - cron: 37 12 * * *
permissions:
  contents: write
concurrency:
  group: qc-daily-scanner-${{ github.ref }}
  cancel-in-progress: false
env:
  QC_SITE_URL: ${{ vars.QC_SITE_URL || 'https://jtack6769.github.io/Quote_challenge/' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare report folder
      run: |
        mkdir -p "$RUNNER_TEMP/qc-report"
        echo "QC_REPORT_DIR=$RUNNER_TEMP/qc-report" >> "$GITHUB_ENV"
    - name: Checkout website
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install isolated scanner tools
      id: tools
      run: |
        mkdir -p "$RUNNER_TEMP/qc-scanner" "$QC_REPORT_DIR"
        npm install --prefix "$RUNNER_TEMP/qc-scanner" --ignore-scripts --no-audit --no-fund eslint@9.39.1 stylelint@16.25.0 htmlhint@1.6.3 parse5@7.3.0 playwright@1.56.1
    - name: Scan code, JSON and local references
      id: code
      continue-on-error: true
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      run: |
        cat > "$RUNNER_TEMP/qc-scanner/scan.cjs" <<'SCANNER'
        const fs = require('node:fs');
        const path = require('node:path');
        const { execFileSync } = require('node:child_process');
        const { Linter } = require('eslint');
        const { HTMLHint } = require('htmlhint');
        const parse5 = require('parse5');

        async function main() {
          const stylelint = (await import('stylelint')).default;
          const root = process.env.GITHUB_WORKSPACE;
          if (!root) throw new Error('GITHUB_WORKSPACE is required');
          const files = execFileSync('git', ['ls-files', '-z'], { cwd: root, encoding: 'utf8' })
            .split('\0').filter(Boolean).filter(file =>
              /\.(?:html?|[cm]?js|css|json)$/i.test(file) &&
              !/(^|\/)(?:node_modules|vendor|\.git|_site)\//.test(file) &&
              !/\.min\.(?:js|css)$/i.test(file) &&
              !file.startsWith('.github/workflows/Qc reports/'));
          const findings = [];
          const counts = { html: 0, javascript: 0, css: 0, json: 0, references: 0 };
          const tracked = new Set(execFileSync('git', ['ls-files', '-z'], { cwd: root, encoding: 'utf8' }).split('\0').filter(Boolean));
          const linter = new Linter();
          function add(file, line, column, message) {
            findings.push({ file, line: Math.max(1, line || 1), column: Math.max(1, column || 1), message });
          }
          function js(code, file, sourceType = 'module', offset = 0) {
            counts.javascript++;
            for (const item of linter.verify(code, {
              languageOptions: { ecmaVersion: 'latest', sourceType },
              linterOptions: { noInlineConfig: true },
              rules: { 'no-dupe-args': 'error', 'no-dupe-keys': 'error', 'valid-typeof': 'error' }
            })) add(file, offset + (item.line || 1), item.column, item.message);
          }
          async function css(code, file, offset = 0) {
            counts.css++;
            const result = await stylelint.lint({
              code, codeFilename: path.join(root, 'qc-inline.css'),
              config: { rules: { 'block-no-empty': true, 'color-no-invalid-hex': true } }
            });
            for (const item of result.results) {
              for (const warning of item.warnings || [])
                add(file, offset + (warning.line || 1), warning.column, warning.text);
              for (const error of item.parseErrors || [])
                add(file, offset + (error.line || 1), error.column, error.text);
            }
          }
          async function html(code, file) {
            counts.html++;
            for (const item of HTMLHint.verify(code, {
              'attr-no-duplication': true, 'id-unique': true,
              'tag-pair': true, 'attr-value-double-quotes': false
            })) add(file, item.line, item.col, item.message);
            const document = parse5.parse(code, { sourceCodeLocationInfo: true });
            const hasBase = /<base\s/i.test(code);
            async function visit(node) {
              const location = node.sourceCodeLocation;
              const attributes = Object.fromEntries((node.attrs || []).map(a => [a.name, a.value]));
              // Relative links only; root-relative links can point to other GitHub Pages repos.
              if (!hasBase) for (const key of ['href', 'src', 'poster']) {
                const value = attributes[key];
                if (!value || /^(?:[a-z][a-z0-9+.-]*:|[/#?{])/i.test(value) || value.includes('{{')) continue;
                counts.references++;
                try {
                  const pathname = decodeURIComponent(value.split(/[?#]/)[0]);
                  if (!pathname) continue;
                  const target = path.posix.normalize(path.posix.join(path.posix.dirname(file), pathname));
                  if (target.startsWith('../')) continue;
                  const candidates = [target, path.posix.join(target, 'index.html')];
                  if (!candidates.some(p => tracked.has(p))) add(file, location?.startLine, 1, `Missing local ${key}: ${value}`);
                } catch (error) { add(file, location?.startLine, 1, `Invalid local URL: ${value}`); }
              }
              if (node.tagName === 'script' && /^(application\/(ld\+)?json|importmap)$/.test(attributes.type || '')) {
                try { JSON.parse((node.childNodes || []).map(n => n.value || '').join('')); }
                catch (error) { add(file, location?.startLine, 1, `Invalid inline JSON: ${error.message}`); }
              }
              if (location && location.startTag && /^(script|style)$/.test(node.tagName)) {
                const attrs = Object.fromEntries((node.attrs || []).map(a => [a.name, a.value]));
                const start = location.startTag.endOffset;
                const end = location.endTag ? location.endTag.startOffset : location.endOffset;
                // Preserve columns on the opening-tag line and original file line numbers.
                const body = ' '.repeat(location.startTag.endCol - 1) + code.slice(start, end);
                const offset = location.startTag.endLine - 1;
                const type = (attrs.type || '').trim().toLowerCase().split(';')[0];
                if (node.tagName === 'style' && (!type || type === 'text/css')) await css(body, file, offset);
                if (node.tagName === 'script' && !('src' in attrs) &&
                    ['', 'module', 'text/javascript', 'application/javascript', 'text/ecmascript', 'application/ecmascript'].includes(type))
                  js(body, file, type === 'module' ? 'module' : 'script', offset);
              }
              for (const child of node.childNodes || []) await visit(child);
              if (node.content) await visit(node.content);
            }
            await visit(document);
          }
          for (const file of files) {
            const absolute = path.join(root, file);
            // Never follow repository symlinks to files outside the checkout.
            if (!fs.lstatSync(absolute).isFile()) continue;
            const code = fs.readFileSync(absolute, 'utf8');
            if (/\.html?$/i.test(file)) await html(code, file);
            else if (/\.css$/i.test(file)) await css(code, file);
            else if (/\.json$/i.test(file)) { counts.json++; try { JSON.parse(code); } catch (error) { add(file, 1, 1, `Invalid JSON: ${error.message}`); } }
            else js(code, file, /\.cjs$/i.test(file) ? 'commonjs' : 'module');
          }
          const escapeData = value => String(value).replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const escapeProperty = value => escapeData(value).replace(/:/g, '%3A').replace(/,/g, '%2C');
          findings.forEach((item, index) => {
            if (index < 50) console.log(`::error file=${escapeProperty(item.file)},line=${item.line},col=${item.column}::${escapeData(item.message)}`);
            else console.log(JSON.stringify(item));
          });
          const summary = [
            '# Quote Challenge code scan', '',
            `Checked ${counts.html} HTML files, ${counts.javascript} JavaScript files/blocks, and ${counts.css} CSS files/blocks; ${counts.json} JSON files and ${counts.references} local references.`, '',
            `Found ${findings.length} issue(s).`, '',
            'Checks tracked HTML, JavaScript, and CSS, including script/style blocks inside HTML. Skips vendor folders, node_modules, _site, symlinks, and *.min.js/*.min.css.', '',
            'Static checks do not test button behavior, external links, CSS url() references, srcset, inline event attributes, or server-side templates. Relative references on pages using a base tag are skipped. JSON must be strict JSON. It does not change files or deploy the website.', ''
          ];
          for (const item of findings.slice(0, 100)) summary.push(`- ${JSON.stringify(item.file)}:${item.line}:${item.column} — ${item.message.replace(/[\r\n]/g, ' ')}`);
          if (findings.length > 100) summary.push('', 'Additional issues are listed in the scan log.');
          console.log(`Checked ${files.length} candidate files; found ${findings.length} issue(s).`);
          if (!files.length) { summary.push('', 'ERROR: No supported tracked files found.'); process.exitCode = 1; }
          fs.mkdirSync(process.env.QC_REPORT_DIR, { recursive: true });
          fs.writeFileSync(path.join(process.env.QC_REPORT_DIR, 'code-report.md'), summary.join('\n') + '\n');
          fs.writeFileSync(path.join(process.env.QC_REPORT_DIR, 'code-report.json'), JSON.stringify({ counts, findings }, null, 2));
          if (findings.length) process.exitCode = 1;
        }
        main().catch(error => { console.error(error); process.exitCode = 1; });
        SCANNER
        node "$RUNNER_TEMP/qc-scanner/scan.cjs"
    - name: Install Chromium
      id: browser_install
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      run: |
        node "$RUNNER_TEMP/qc-scanner/node_modules/playwright/cli.js" install --with-deps chromium
    - name: Check live pages in Chromium
      id: browser
      continue-on-error: true
      if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
      timeout-minutes: 6
      run: |
        cat > "$RUNNER_TEMP/qc-scanner/browser.cjs" <<'BROWSER'
        const fs = require('node:fs');
        const path = require('node:path');
        const { chromium } = require('playwright');
        async function main() {
          const out = process.env.QC_REPORT_DIR;
          fs.mkdirSync(out, {recursive: true});
          const base = new URL(process.env.QC_SITE_URL);
          if (!base.pathname.endsWith('/')) base.pathname += '/';
          const pages = ['', 'one-player.html', 'two-player.html', 'next.html', 'bonus.html'];
          const findings = [], checks = [];
          const browser = await chromium.launch();
          try {
            for (const file of pages) {
              if (file && !fs.existsSync(path.join(process.env.GITHUB_WORKSPACE, file))) {
                checks.push({file, status: 'SKIPPED: page absent from checkout'}); continue;
              }
              const context = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const page = await context.newPage();
              const url = new URL(file, base).href;
              const observed = new Set();
              const add = (level, message) => {
                const key = level + message;
                if (!observed.has(key)) findings.push({file: file || 'index.html', level, message});
                observed.add(key);
              };
              page.on('pageerror', error => add('error', 'Uncaught JavaScript: ' + error.message));
              page.on('response', response => {
                if (response.status() >= 400) {
                  const local = new URL(response.url()).origin === base.origin;
                  add(local ? 'error' : 'warning', `HTTP ${response.status()}: ${response.url()}`);
                }
              });
              page.on('requestfailed', request => {
                const reason = request.failure()?.errorText || 'Unknown';
                if (!reason.includes('ERR_ABORTED')) add('warning', `Request failed: ${request.url()} (${reason})`);
              });
              try {
                let response;
                for (let attempt = 0; attempt < 3; attempt++) {
                  try {
                    response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 25000 });
                    if (response && response.status() < 500) break;
                  } catch (error) { if (attempt === 2) throw error; }
                }
                if (!response || !response.ok()) add('error', `Page unavailable: ${response?.status() || 'no response'}`);
                // Short observation window catches startup errors without waiting on looping media.
                await page.waitForTimeout(2500);
                const title = await page.title();
                if (!title.trim()) add('warning', 'Missing page title');
                const body = await page.locator('body').innerText({timeout: 5000});
                if (!body.trim()) add('warning', 'No visible text; inspect screenshot');
                const images = await page.locator('img').evaluateAll(nodes => nodes.filter(n => n.complete && n.currentSrc && !n.naturalWidth).map(n => n.currentSrc));
                for (const image of images) add('warning', 'Broken image: ' + image);
                await page.screenshot({ path: path.join(out, (file || 'index.html').replace(/\.html$/, '') + '-desktop.png'), fullPage: false, timeout: 10000 });
                await page.setViewportSize({width: 390, height: 844});
                await page.screenshot({ path: path.join(out, (file || 'index.html').replace(/\.html$/, '') + '-phone.png'), fullPage: false, timeout: 10000 });
                checks.push({file: file || 'index.html', url, status: response?.status(), title});
              } catch (error) { add('error', 'Browser check failed: ' + error.message); }
              await context.close();
            }
          } finally { await browser.close(); }
          fs.writeFileSync(path.join(out, 'browser-report.json'), JSON.stringify({checks, findings}, null, 2));
          const lines = ['# Live browser checks', '', ...checks.map(c => '- ' + JSON.stringify(c)), '', ...findings.map(f => '- ' + f.level.toUpperCase() + ': ' + JSON.stringify(f))];
          lines.push('', 'Checks published pages, startup errors and loading resources. Does not click buttons, submit forms, check scoring or test gameplay. Screenshots are desktop and phone viewport snapshots in Chromium, not real phone device tests. External resource errors are warnings. A transient HTTP error during retry remains recorded for review.');
          fs.writeFileSync(path.join(out, 'browser-report.md'), lines.join('\n'));
          if (findings.some(f => f.level === 'error')) process.exitCode = 1;
        }
        main().catch(error => { console.error(error); process.exitCode = 1; });
        BROWSER
        node "$RUNNER_TEMP/qc-scanner/browser.cjs"
    - name: Write daily report even after failure
      if: ${{ always() }}
      env:
        TOOLS: ${{ steps.tools.outcome }}
        CODE: ${{ steps.code.outcome }}
        BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
        BROWSER: ${{ steps.browser.outcome }}
      run: |
        python3 - <<'REPORT'
        import json, os
        from pathlib import Path
        out = Path(os.environ['QC_REPORT_DIR'])
        out.mkdir(parents=True, exist_ok=True)
        statuses = {k: os.environ.get(k, 'unknown') for k in ['TOOLS', 'CODE', 'BROWSER_INSTALL', 'BROWSER']}
        passed = all(s == 'success' for s in statuses.values())
        run = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
        lines = ['# Quote Challenge Daily Scanner', '', '**' + ('PASS' if passed else 'NEEDS ATTENTION') + '**', '', 'Run: ' + run, '', 'Commit: ' + os.environ['GITHUB_SHA'], '', '| Stage | Result |', '| --- | --- |']
        lines += ['| ' + key + ' | ' + value + ' |' for key, value in statuses.items()]
        lines += ['', 'A failed setup is a scanner problem; findings in code/browser reports are website problems. Skipped checks are not a pass. Checkout code and published pages may differ if deployment is pending.', '']
        for name in ['code-report.md', 'browser-report.md']:
            p = out / name
            lines += [p.read_text() if p.exists() else '**Missing ' + name + ': this stage did not finish. See the run log.**', '']
        lines += ['Reports and screenshots are in the downloadable qc-daily-report artifact. Markdown and JSON reports are also saved under .github/workflows/Qc reports/daily-scanner, with a separate folder for each run attempt. The workflow does not edit website pages or deploy anything.', '']
        text = '\n'.join(lines)
        (out / 'daily-report.md').write_text(text)
        (out / 'run-status.json').write_text(json.dumps({'passed': passed, 'stages': statuses, 'run': run}, indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(text[:950000])
        REPORT
    - name: Save reports and screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: qc-daily-report-${{ github.run_number }}-${{ github.run_attempt }}
        path: ${{ env.QC_REPORT_DIR }}
        retention-days: 30
        if-no-files-found: error
    - name: Checkout report destination
      id: report_checkout
      if: ${{ always() }}
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: qc-report-store
        persist-credentials: true
    - name: Save reports to repository
      if: ${{ always() && steps.report_checkout.outcome == 'success' }}
      env:
        REPORT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ ! -f "$QC_REPORT_DIR/daily-report.md" ]; then
          echo "::error::The daily report was not generated; check the report-writing step."
          exit 1
        fi
        cd "$GITHUB_WORKSPACE/qc-report-store"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        base='.github/workflows/Qc reports/daily-scanner'
        run_folder="run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
        for attempt in 1 2 3; do
          # Refresh this disposable checkout to preserve intervening repository updates.
          git fetch origin "$REPORT_BRANCH"
          git reset --hard FETCH_HEAD
          destination="$base/$run_folder"
          mkdir -p "$destination"
          find "$QC_REPORT_DIR" -maxdepth 1 -type f \( -name '*.md' -o -name '*.json' \) -exec cp -- {} "$destination/" \;
          cat > "$base/README.md" <<REPORT_INDEX
        # Quote Challenge Daily Scanner reports

        [Open the latest report]($run_folder/daily-report.md)

        Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

        Scanned commit: $GITHUB_SHA

        Each run and rerun has its own folder. Earlier reports are kept.
        Full findings are in code-report.json and browser-report.json inside each run folder.
        Screenshots remain in the downloadable qc-daily-report artifact for 30 days.
        REPORT_INDEX
          git add -- "$destination" "$base/README.md"
          if git diff --cached --quiet; then
            echo "Reports already saved."
            exit 0
          fi
          git commit -m "Save QC scanner report ${GITHUB_RUN_NUMBER}, attempt ${GITHUB_RUN_ATTEMPT}"
          if git push origin "HEAD:refs/heads/$REPORT_BRANCH"; then
            echo "Reports saved to $destination"
            printf '\nReports saved in `%s`.\n' "$destination" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        done
        echo "::error::Could not save reports to the repository. Check branch protection and Actions write permissions. The uploaded artifact is still available if its upload succeeded."
        exit 1
