<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#03050b"><title>Welcome | Quote Challenge</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#203b62,#03050b 70%);color:#fff;font:16px/1.6 system-ui,Arial,sans-serif}main{width:min(680px,100%);padding:clamp(22px,6vw,48px);border:1px solid #d6a54e;border-radius:18px;background:#091225e8;text-align:center;box-shadow:0 16px 48px #0009}h1{color:#ffdf84}a{display:inline-block;margin:8px;padding:12px 18px;border:1px solid #8bb9e0;border-radius:9px;color:#ffe7a0;text-decoration:none;font-weight:700}a:hover,a:focus-visible{background:#234d7c}a:focus-visible{outline:3px solid white;outline-offset:3px}</style><style>.qc-local-clock{position:fixed;z-index:9999;top:12px;right:14px;padding:8px 12px;border:1px solid #ffe36a;border-radius:9px;background:#05070ddd;color:#ffe36a;font:700 16px/1.2 ui-monospace,monospace;box-shadow:0 2px 12px #0009;font-variant-numeric:tabular-nums}.qc-local-clock small{font:600 11px system-ui,sans-serif;color:#fff;margin-left:4px}@media(max-width:600px){.qc-local-clock{top:6px;right:6px;padding:6px 8px;font-size:13px}}</style>
</head>
<body>
<div class="qc-local-clock" role="timer" aria-label="Your local time"><time id="qc-local-time">--:--:--</time><small id="qc-local-ampm">--</small></div><main><p>WELCOME TO THE DRIVE-IN</p><h1>Quote Challenge</h1><p>Pick a seat, choose a challenge, and see how many lines you know.</p><a href="one-player.html">Play solo</a><a href="two-player.html">Play with a friend</a><a href="Making_arun.html">About Logan's Run</a></main><script>(function(){const t=document.getElementById('qc-local-time'),a=document.getElementById('qc-local-ampm');function tick(){const d=new Date();t.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(d).replace(/\s?(AM|PM)$/i,'');a.textContent=new Intl.DateTimeFormat(undefined,{hour:'numeric',hour12:true}).format(d).replace(/^.*\s/,'')}tick();setInterval(tick,1000)})();</script>
</body>
</html>
