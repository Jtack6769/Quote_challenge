<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quote Challenge | Theater 7.0 Logan's Tun is Here!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#03050b;color:#fff;font-family:system-ui,Arial,sans-serif}
body{padding-bottom:24px}
.theater{position:relative;width:100%;max-width:1648px;aspect-ratio:1648/928;margin:0 auto;background:url('theater-night.png') center/100% 100% no-repeat;overflow:hidden}
.theater.is-day{background-image:url('theater-day.png')}
.theater.is-night{background-image:url('theater-night.png')}
.door-link{position:absolute;display:block;top:43.3%;height:43.8%;z-index:2;cursor:pointer;border-radius:5px}
.door-one{left:32.5%;width:14.4%}
.door-two{left:52.9%;width:13.8%}
.door-link::after{content:attr(data-label);position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:max-content;max-width:98%;padding:3px 5px;border:1px solid #ffdf84;border-radius:4px;background:#080d18cc;color:#ffdf84;font-size:clamp(8px,1.1vw,14px);font-weight:800;letter-spacing:.06em;text-align:center;white-space:nowrap;opacity:0;transition:opacity .18s ease}
.door-link:hover::after,.door-link:focus-visible::after{opacity:1}
.door-link:focus-visible{outline:3px solid #fff39b;outline-offset:2px}
.below-stage{position:relative;width:min(1500px,96%);margin:18px auto 0;padding:14px;display:grid;grid-template-columns:minmax(180px,250px) minmax(0,1fr);gap:16px;align-items:stretch;border:1px solid #8bb9e077;border-radius:24px;background:radial-gradient(ellipse 85% 75% at 72% 4%,#3b75c044,transparent 72%),linear-gradient(180deg,#142d51 0%,#071224 48%,#02060e 100%);box-shadow:0 12px 36px #000b,inset 0 1px #ffffff20}
.navigation,.viewer-panel{position:relative;isolation:isolate;overflow:hidden;min-width:0;border:1px solid #8bb9e077;border-radius:22px;background:radial-gradient(ellipse 110% 52% at 72% 16%,#3f7ab94a,transparent 72%),linear-gradient(160deg,#102440,#050b16 76%);box-shadow:0 8px 28px #0009,inset 0 1px #ffffff20}
.navigation{padding:18px}
.navigation h2,.viewer-panel h2{margin:0 0 12px;color:#ffdf84;font-size:20px}
.navigation p{margin:0 0 14px;color:#c8d1e4;font-size:14px;line-height:1.5}
.nav-links{display:grid;gap:10px}
.nav-links a{display:block;padding:12px 14px;border:1px solid #92c4e077;border-radius:12px;background:linear-gradient(180deg,#517ca856 0%,#1b3c63 12%,#10233e 54%,#07152a 100%);box-shadow:inset 0 1px 1px #e7f7ff77,inset 0 -8px 14px #0005;color:#ffe7a0;text-decoration:none;font-weight:700;transition:background .18s ease,transform .18s ease,border-color .18s ease}
.nav-links a:hover,.nav-links a:focus-visible,.picture-slot:hover,.picture-slot:focus-visible{background:linear-gradient(180deg,#527ba6,#234d7c 40%,#0b2447);border-color:#b5e2ff;box-shadow:inset 0 1px 2px #e7f7ff99,0 0 14px #72bbff33}
.nav-links a:hover,.nav-links a:focus-visible{transform:translateX(2px)}
.nav-links a:focus-visible,.picture-slot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.picture-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:12px}
.picture-slot{padding:9px 4px;border:1px solid #92c4e077;border-radius:12px;background:linear-gradient(180deg,#517ca856 0%,#1b3c63 12%,#10233e 54%,#07152a 100%);color:#ffe7a0;font:700 13px/1.3 system-ui,Arial,sans-serif;cursor:pointer;transition:background .18s ease,border-color .18s ease}
.viewer-panel{display:flex;flex-direction:column;padding:18px}
.viewer-panel h2{margin-bottom:10px}
.viewer-panel iframe{display:block;flex:1;width:100%;min-height:560px;border:1px solid #8ab7e088;border-radius:14px;background:#03050b;box-shadow:inset 0 0 15px #000,0 0 0 1px #0008,0 6px 16px #0008}
@media(max-width:700px){.below-stage{grid-template-columns:1fr;margin-top:12px}.navigation{padding:14px}.nav-links{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-panel{min-height:520px;padding:14px}}
@media(max-width:420px){.nav-links{grid-template-columns:1fr}.viewer-panel{min-height:440px}.viewer-panel iframe{min-height:380px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <section class="theater" aria-label="Quote Challenge theater entrance">
    <a class="door-link door-one" href="one-player.html" target="mainViewer" aria-label="Open one-player game in the main viewing panel" title="Parking for One" data-label="PARKING FOR ONE"></a>
    <a class="door-link door-two" href="two-player.html" target="mainViewer" aria-label="Open two-player game in the main viewing panel" title="Parking for Two" data-label="PARKING FOR TWO"></a>
  </section>
  <div class="below-stage">
    <nav class="navigation" aria-label="Site pages">
      <h2>Choose a feature</h2>
      <p>Select a link to show it in the viewing panel.</p>
      <div class="nav-links">
        <a href="one-player.html" target="mainViewer">One-player challenge</a>
        <a href="two-player.html" target="mainViewer">Two-player challenge</a>
        <a href="home-panel.html" target="mainViewer">Home</a>
        <a href="box_robot.html" target="mainViewer" class="feature-slot">Box (Come on in!)</a>
        <a href="lunatic_fringe.html" target="mainViewer" class="feature-slot">Going crazy</a>
        <a href="qc-marquee.html" target="mainViewer" class="feature-slot">The old banner</a>
        <a href="bonus.html" target="mainViewer" class="feature-slot">bonus.html</a>
        <a href="next.html" target="mainViewer" class="feature-slot">next.html</a>
        <a href="#" target="mainViewer" class="feature-slot">Meet Creatos</a>
        <a href="fastrounde.html" target="mainViewer" class="feature-slot">Fast Five ,step on in.</a>
        <a href="#" target="mainViewer" class="feature-slot">Feature 08</a>
        <a href="#" target="mainViewer" class="feature-slot">Feature 09</a>
        <a href="#" target="mainViewer" class="feature-slot">Feature 10</a>
      </div>
      <h2 style="margin-top:20px">Picture projector</h2>
      <div class="picture-links" aria-label="Picture shortcuts">
        <button type="button" class="picture-slot" data-image="logan-poster.png">Logan's Run poster</button>
        <button type="button" class="picture-slot" data-image="theater-day.png">Daytime theater</button>
        <button type="button" class="picture-slot" data-image="theater-night.png">Nighttime theater</button>
      </div>
    </nav>
    <section class="viewer-panel" aria-labelledby="viewerTitle">
      <h2 id="viewerTitle">Main viewing area</h2>
      <iframe name="mainViewer" title="Selected Quote Challenge page" src="home-panel.html"></iframe>
    </section>
  </div>
</main>
<script>
// Match the theater artwork to the visitor's local time.
function updateTheaterLighting(){
  const hour = new Date().getHours();
  const stage = document.querySelector('.theater');
  stage.classList.toggle('is-day', hour >= 6 && hour < 18);
  stage.classList.toggle('is-night', hour < 6 || hour >= 18);
}
updateTheaterLighting();
setInterval(updateTheaterLighting, 60000);

const mainViewer = document.querySelector('iframe[name="mainViewer"]');
const viewerPanel = document.querySelector('.viewer-panel');

function showViewerMessage(title, message){
  const doc = document.implementation.createHTMLDocument(title);
  const style = doc.createElement('style');
  style.textContent = 'body{margin:0;min-height:100vh;background:#03050b;color:#ffe7a0;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;text-align:center}main{padding:24px;width:min(680px,100%)}h1{color:#ffdf84}p{color:#c8d1e4;line-height:1.6}';
  doc.head.append(style);
  const main = doc.createElement('main');
  const heading = doc.createElement('h1');
  heading.textContent = title;
  const paragraph = doc.createElement('p');
  paragraph.textContent = message;
  main.append(heading, paragraph);
  doc.body.append(main);
  mainViewer.removeAttribute('src');
  mainViewer.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
}

function projectPicture(title, imagePath){
  const doc = document.implementation.createHTMLDocument(title);
  const style = doc.createElement('style');
  style.textContent = 'body{margin:0;min-height:100vh;background:#03050b;color:#ffe7a0;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;text-align:center}main{padding:18px;width:100%;height:100vh;display:grid;place-items:center}img{max-width:100%;max-height:calc(100vh - 36px);object-fit:contain}p{padding:16px}';
  doc.head.append(style);
  const main = doc.createElement('main');
  const img = doc.createElement('img');
  img.alt = title;
  img.src = new URL(imagePath, location.href).href;
  img.addEventListener('error', () => {
    const message = doc.createElement('p');
    message.textContent = 'Picture not found: ' + imagePath;
    img.replaceWith(message);
  });
  main.append(img);
  doc.body.append(main);
  mainViewer.removeAttribute('src');
  mainViewer.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
}

document.querySelectorAll('.picture-slot').forEach(button => {
  button.addEventListener('click', () => {
    const filename = button.dataset.image.trim();
    if (!filename) {
      showViewerMessage(button.textContent.trim(), 'Add an image filename to this picture button to use it.');
    } else {
      projectPicture(button.textContent.trim(), filename);
    }
    viewerPanel.scrollIntoView({behavior:'smooth',block:'start'});
  });
});

// A real page link clears a previously projected srcdoc before the iframe navigates.
document.querySelectorAll('a[target="mainViewer"]').forEach(link => {
  link.addEventListener('click', event => {
    const href = link.getAttribute('href');
    if (!href || href === '#') {
      event.preventDefault();
      if (link.classList.contains('feature-slot')) {
        showViewerMessage(link.textContent.trim(), 'This feature slot is ready. Update its href to the page you want to show here.');
        viewerPanel.scrollIntoView({behavior:'smooth',block:'start'});
      }
      return;
    }
    mainViewer.removeAttribute('srcdoc');
  });
});
</script>
</body>
</html>
