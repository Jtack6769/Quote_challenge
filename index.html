<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Poster Flip Card</title>
    <style>
        /* Base page layout centering the card */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 1. THE CONTAINER: Defines the size of your card and turns on 3D perspective */
        .card-container {
            width: 300px;
            height: 450px;
            perspective: 1000px; /* Gives the flip a 3D depth effect */
        }

        /* 2. THE FLIPPER: This is the actual box that spins around when hovered */
        .movie-flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d; /* Tells child elements to exist in 3D space */
            transition: transform 0.6s ease; /* Controls how fast and smooth the spin is */
        }

        /* Trigger the spin when you hover over the container */
        .card-container:hover .movie-flipper {
            transform: rotateY(180deg);
        }

        /* 3. THE FACES: Shared styles for both the front and back sides */
        .movie-face, .poster-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden; /* Hides the back side of a card when it's facing away */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* FRONT FACE: The Text Side */
        .movie-face {
            background-color: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            border: 2px solid #333;
        }

        /* BACK FACE: The Image Side */
        .poster-face {
            background-color: #000;
            transform: rotateY(180deg); /* Pre-flips the back image so it looks right when spun */
        }

        /* Make sure the image stretches perfectly to fill its side */
        .poster-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- Wrapped in a container so the hover mechanism triggers correctly -->
    <div class="card-container">
        
        <!-- This matches the exact code structure from your image -->
        <div class="movie-flipper" id="movieFlipper">
            
            <!-- Front of the card -->
            <div class="movie-face" id="movieTitle">
                COMING SOON
            </div>
            
            <!-- Back of the card -->
            <div class="poster-face">
                <!-- Replace 'https://picsum.photos' with your actual 'poster.png' path later -->
                <img src="https://picsum.photos" alt="Logan's Run poster">
            </div>

        </div>

    </div>

</body>
</html>
