<title>Quote Challenge · Choose Your Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#020202;color:#ffe143;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;display:grid;place-items:center;overflow-x:hidden}
.wrap{width:min(100vw,1280px);position:relative;isolation:isolate;background:#020202;box-shadow:0 0 90px #001b52}
.poster{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border:0;border-radius:28px;background:transparent;cursor:pointer;outline:none;touch-action:manipulation}
.hotspot:focus-visible{box-shadow:0 0 0 4px #ffe23d,0 0 32px #0877ff}
.hotspot:active{background:rgba(255,228,50,.08);box-shadow:inset 0 0 48px rgba(18,126,255,.2)}
.one{left:9%;top:48%;width:36%;height:36%}
.two{left:53%;top:48%;width:37%;height:36%}
.badge{position:absolute;left:50%;bottom:2.1%;transform:translateX(-50%);padding:7px 13px;border:1px solid rgba(255,220,50,.45);border-radius:999px;background:rgba(0,0,0,.76);color:#ffd84a;font-weight:800;font-size:clamp(9px,1.4vw,13px);letter-spacing:.10em;white-space:nowrap;box-shadow:0 0 18px rgba(0,105,255,.25)}
.bug{position:absolute;right:1.8%;bottom:2%;z-index:8;border:1px solid rgba(28,132,255,.8);border-radius:999px;background:rgba(0,0,0,.82);color:#ffe143;padding:7px 11px;font-weight:900;font-size:clamp(9px,1.25vw,12px);letter-spacing:.08em;cursor:pointer;box-shadow:0 0 14px rgba(0,105,255,.28)}
.bug:focus-visible{outline:3px solid #ffe23d;outline-offset:2px}
.fallback{display:none;padding:24px;text-align:center}
.fallback a{display:inline-block;margin:8px;padding:16px 22px;border:2px solid #168cff;border-radius:18px;color:#ffe143;text-decoration:none;font-weight:900;background:#050505}
@media(max-width:700px){.badge{left:2%;transform:none;bottom:1.2%;font-size:8px;padding:5px 8px}.bug{right:2%;bottom:1.1%;font-size:8px;padding:5px 8px}}
@media(max-width:560px){body{align-items:start}.wrap{min-height:100vh;display:grid;place-items:center}.poster{width:100%;max-height:100vh;object-fit:contain}}
</style>
