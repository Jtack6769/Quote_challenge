<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-12">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quote Challenge 6.9.1-2 — Lunatic Fringe</title>
  <style>
    :root {
      --bg: #880808;
      --panel: #880808;
      --gold: #e6b84d;
      --gold-soft: #c9b976;
      --red: #880808;
      --red-deep: #880808;
      --shadow: #880808;
      --photo-border: #880808;
      --photo-bg: #880808;
      --cream: #f5c76c;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(111, 18, 18, 0.45), transparent 78%),
        linear-gradient(180deg, #080b19 0%, #0d0b18 18%, #14080d 100%);
      color: #fff;
      font-family: Georgia, serif;
      padding: 24px 18px 40px;
    }

    .page-shell {
      width: min(1100px, 100%);
      display: grid;
      gap: 32px;
    }

    .intro {
      display: grid;
      gap: 10px;
    }

    .caption {
      text-align: center;
      color: var(--gold-bright);
      font: 700 14px/1.3 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 196, 68, 0.28);
    }

    .fringe-banner {
      margin: 0;
      padding: 14px 20px;
      border: 2px solid rgba(230, 184, 77, 0.7);
      border-radius: 12px;
      background: rgba(20, 10, 18, 0.88);
      color: #f7d7a8;
      text-align: center;
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32), inset 0 0 18px rgba(255, 180, 71, 0.14);
    }

    .marquee {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      min-height: 110px;
      display: grid;
      place-items: center;
      border: 3px solid var(--gold);
      border-radius: 14px;
      background: radial-gradient(ellipse at center, rgba(208, 73, 38, 0.22), rgba(12, 12, 18, 0.9) 62%);
      box-shadow:
        0 22px 28px rgba(0,0,0,0.35),
        inset 0 0 34px rgba(255, 141, 105, 0.12),
        0 0 26px rgba(230, 184, 77, 0.2);
    }

    .marquee::after {
      content: "";
      position: absolute;
      inset: -28%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.27;
      background: repeating-linear-gradient(101deg, transparent 0 30px, rgba(255, 199, 106, 0.07) 37px, transparent 51px 82px);
      animation: heatDrift 9s ease-in-out infinite alternate;
    }

    .marquee::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(255, 229, 165, 0.53);
      border-radius: 9px;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes heatDrift {
      0% { transform: translate(-1.5%, 2%) skewX(-2deg) scale(1.02); filter: blur(12px); }
      50% { transform: translate(1%, -1.5%) skewX(2deg) scale(1.06); filter: blur(8px); }
      100% { transform: translate(-0.5%, 1%) skewX(-1deg) scale(1.04); filter: blur(10px); }
    }

    .message {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px 22px;
      font-size: clamp(27px, 5.7vw, 62px);
      font-weight: 700;
      letter-spacing: 0.065em;
      line-height: 1.1;
      color: var(--ue);
      text-shadow: 0 2px 2px #300000, 0 0 5px rgba(255, 95, 95, 0.55), 0 0 24px rgba(255, 58, 58, 0.4);
      transition: opacity 0.25s ease;
      user-select: none;
    }

    .message.hide { opacity: 0; }

    .wave {
      position: absolute;
      z-index: 3;
      top: -12%;
      height: 124%;
      width: 85%;
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 14px rgba(72,202,255,0.67));
      background: linear-gradient(90deg, transparent 0%, rgba(113,48,230,0.78) 16%, rgba(236,54,106,0.9) 36%, rgba(255,196,68,0.96) 59%, rgba(44,201,255,0.78) 78%, transparent 100%);
    }

    .wave.run-right {
      clip-path: polygon(0 0, 100% 0, 67% 100%, 0 100%);
      animation: sweepRight 2.2s ease-in-out both;
    }

    .wave.run-left {
      clip-path: polygon(0 0, 100% 0, 100% 100%, 33% 100%);
      background: linear-gradient(270deg, transparent 0%, rgba(113,48,230,0.78) 16%, rgba(236,54,106,0.9) 36%, rgba(255,196,68,0.96) 59%, rgba(44,201,255,0.78) 78%, transparent 100%);
      animation: sweepLeft 2.2s ease-in-out both;
    }

    @keyframes sweepRight {
      0% { left: 0; transform: translateX(-110%); opacity: 0; }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% { left: 100%; transform: translateX(5%); opacity: 0; }
    }

    @keyframes sweepLeft {
      0% { right: 0; transform: translateX(110%); opacity: 0; }
      12% { opacity: 1; }
      85% { opacity: 1; }
      100% { right: 100%; transform: translateX(-5%); opacity: 0; }
    }

    .wall-gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 6px;
    }

    .hanging-frame {
      position: relative;
      padding: 12px 12px 14px;
      background: #180707;
      border: 8px ridge var(--photo-border);
      border-radius: 4px;
      box-shadow: 0 25px 35px rgba(0,0,0,.9), 0 5px 18px rgba(136, 8, 8, 0.53);
      transform: rotate(var(--angle, 0deg));
      transition: transform .18s ease, box-shadow .18s ease, z-index .18s ease;
      will-change: transform;
      cursor: pointer;
    }

    .hanging-frame:nth-child(odd) { --angle: -1.5deg; }
    .hanging-frame:nth-child(even) { --angle: 1.8deg; }
    .hanging-frame:nth-child(3n) { --angle: -0.7deg; }

    .hanging-frame:hover,
    .hanging-frame:focus-visible {
      transform: rotate(0) scale(1.03);
      z-index: 10;
      box-shadow: 0 25px 35px #000, 0 0 24px rgba(136, 8, 8, 0.9);
    }

    .hanging-frame:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 7px;
    }

    .hanging-frame img {
      display: block;
      width: 260px;
      max-width: 100%;
      height: auto;
      min-height: 180px;
      object-fit: contain;
      border: 1px solid var(--photo-border);
      background: var(--photo-bg);
    }

    .missing-label {
      display: none;
      padding: 15px;
      max-width: 260px;
      color: #ffd6d6;
      font: 14px/1.5 system-ui, sans-serif;
      overflow-wrap: anywhere;
    }

    .hanging-frame.missing { cursor: default; }
    .hanging-frame.missing .missing-label { display: block; }
    .hanging-frame.missing img { display: none; }

    dialog.viewer {
      border: 8px ridge var(--photo-border);
      border-radius: 5px;
      background: #100606;
      color: white;
      padding: 15px;
      width: max-content;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 24px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.75);
    }

    dialog.viewer::backdrop {
      background: rgba(0,0,0,0.9);
    }

    .viewer img {
      display: block;
      max-width: min(88vw, 1100px);
      max-height: 76vh;
      object-fit: contain;
      background: #000;
    }

    .viewer .close {
      display: block;
      margin: 0 0 12px auto;
      padding: 7px 12px;
      background: #880808;
      border: 1px solid #e7a5a5;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      border-radius: 4px;
    }

    .viewer .close:hover { background: #a50b0b; }

    .switch-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin: 10px auto 0;
      text-align: center;
    }

    .exit-switch {
      width: 112px;
      height: 135px;
      border: 7px ridge var(--photo-border);
      border-radius: 8px;
      background: linear-gradient(140deg, #340b0b, #080808);
      box-shadow: 0 12px 25px #000, 0 0 16px rgba(136, 8, 8, 0.73);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      color: #ffd7d7;
      font: 700 1.05rem/1 Georgia, serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .exit-switch .lever {
      display: block;
      width: 34px;
      height: 55px;
      border: 4px ridge #999;
      background: linear-gradient(90deg, #333, #ddd 50%, #555);
      border-radius: 6px;
      box-shadow: 0 3px 8px #000;
      transition: transform .15s ease;
    }

    .exit-switch:active .lever { transform: translateY(6px); }
    .exit-switch:focus-visible { outline: 3px solid var(--cream); outline-offset: 5px; }

    #sound-status {
      min-height: 1.5em;
      color: #f0b9a9;
      font: 14px system-ui, sans-serif;
    }

    @media (max-width: 600px) {
      body { padding: 28px 16px 38px; }
      .fringe-banner { margin: -18px -8px 0; }
      .wall-gallery { gap: 28px; }
      .hanging-frame img { width: min(260px, 72vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .marquee::after, .wave, .message, .hanging-frame, .exit-switch .lever { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <section class="intro" aria-label="Intro area">
      <div class="caption">👻THIS ISN'T QUOTE CHALLENGE ANYMORE ☠️</div>
      <h1 class="fringe-banner">WELCOME TO THE DARK SIDE!? I SEEN A LIGHT SWITCH SOMEWHERE? 😕</h1>
      <div class="marquee" aria-label="Animated Quote Challenge welcome messages">
        <div class="message" id="message">👹 YOU FOUND HELL AND WE'RE GLAD TO HAVE YOU CHIEF 👹</div>
        <div class="wave" id="wave" aria-hidden="true"></div>
      </div>
    </section>

    <main class="wall-gallery" aria-label="Framed picture gallery">
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 1">
        <img src="image_33e0ebf5.jpg" alt="Gallery picture 1" loading="lazy">
        <span class="missing-label"></span>
      </div>
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 2">
        <img src="gemini_remix_20261021_232243.jpg" alt="Gallery picture 2" loading="lazy">
        <span class="missing-label"></span>
      </div>
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 3">
        <img src="image_eadaddeb.jpg" alt="Gallery picture 3" loading="lazy">
        <span class="missing-label"></span>
      </div>
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 4">
        <img src="gemini_remix_20261021_232703.jpg" alt="Gallery picture 4" loading="lazy">
        <span class="missing-label"></span>
      </div>
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 5">
        <img src="image_7e6db39.jpg" alt="Gallery picture 5" loading="lazy">
        <span class="missing-label"></span>
      </div>
      <div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 6">
        <img src="image_695db1f.jpg" alt="Gallery picture 6" loading="lazy">
        <span class="missing-label"></span>
      </div>
    </main>

    <section class="switch-area" aria-label="Sound effect switch">
      <button class="exit-switch" id="sound-switch" type="button" aria-label="Play surprise sound">
        <span>EXIT</span>
        <span class="lever" aria-hidden="true"></span>
      </button>
      <div id="sound-status" role="status" aria-live="polite"></div>
    </section>
  </div>

  <dialog class="viewer" aria-label="Enlarged gallery picture">
    <button class="close" type="button" aria-label="Close enlarged picture">Close ×</button>
    <img alt="Enlarged gallery picture">
  </dialog>

  <script>
    const slides = [
      { text: "YOU'RE A CHUMP AND A PUNK AND NOW YOU'RE TRAPPED", direction: 'right', hold: 4000 },
      { text: "90 SECONDS ISN'T VERY LONG TO GET OUT", direction: 'left', hold: 4000 },
      { text: "BUT THAT'S WHAT YOU GOT SO HURRY RUN! RUN! RUUNNN!!", direction: 'right', hold: 7000 }
    ];

    const message = document.getElementById('message');
    const wave = document.getElementById('wave');
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function start() {
      let index = 0;
      while (true) {
        const slide = slides[index];
        wave.className = 'wave';
        void wave.offsetWidth;
        wave.classList.add(slide.direction === 'right' ? 'run-right' : 'run-left');
        await sleep(900);
        message.classList.add('hide');
        await sleep(150);
        message.textContent = slide.text;
        message.classList.remove('hide');
        await sleep(1150);
        await sleep(slide.hold);
        index = (index + 1) % slides.length;
      }
    }

    start();

    const viewer = document.querySelector('.viewer');
    const enlargedImage = viewer.querySelector('img');
    const closeButton = viewer.querySelector('.close');
    let lastFrame = null;

    document.querySelectorAll('.hanging-frame').forEach(frame => {
      const photo = frame.querySelector('img');
      const showMissing = () => {
        frame.classList.add('missing');
        const label = frame.querySelector('.missing-label');
        if (label) label.textContent = 'Picture not found: ' + photo.getAttribute('src');
        frame.removeAttribute('role');
        frame.removeAttribute('tabindex');
      };

      photo.addEventListener('error', showMissing);
      if (photo.complete && photo.naturalWidth === 0) showMissing();

      const open = () => {
        if (frame.classList.contains('missing')) return;
        lastFrame = frame;
        enlargedImage.src = photo.currentSrc || photo.src;
        enlargedImage.alt = photo.alt;
        viewer.showModal();
        closeButton.focus();
      };

      frame.addEventListener('click', open);
      frame.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          open();
        }
      });
    });

    closeButton.addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', e => { if (e.target === viewer) viewer.close(); });
    viewer.addEventListener('close', () => {
      enlargedImage.removeAttribute('src');
      if (lastFrame) lastFrame.focus();
    });

    const surpriseSound = new Audio('petergriffinstarwars.mp3');
    document.getElementById('sound-switch').addEventListener('click', async () => {
      const status = document.getElementById('sound-status');
      status.textContent = '';
      try {
        surpriseSound.pause();
        surpriseSound.currentTime = 0;
        await surpriseSound.play();
      } catch (error) {
        console.error('Sound failed:', error);
        status.textContent = 'Sound unavailable. Check petergriffinstarwars.mp3 in this folder.';
      }
    });
  </script>
</body>

  </a>
 </html>
