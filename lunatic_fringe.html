<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunatic Fringe</title>
  <style>
    .marquee {
      position: absolute;
      z-index: 2;
      left: 21.5%;
      top: 20.5%;
      width: 56%;
      height: 8.3%;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: clamp(2px, .34vw, 5px) solid #ffd844;
      border-radius: 3px;
      background: linear-gradient(180deg, #1371e5 0%, #0644a6 46%, #042863 100%);
      box-shadow: 0 0 0 2px #062052, 0 0 22px #2684ffb8, inset 0 0 15px #3c91ff;
      pointer-events: none;
    }
    .marquee:before, .marquee:after {
      content: "✦ Welcome to Hell what took you so long Chum?! ✦  ✦  ✦  ✦";
      position: absolute;
      z-index: 2;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gold);
      font-size: clamp(7px, 1.05vw, 16px);
      letter-spacing: .35em;
      text-shadow: 0 0 8px #ffd94d;
    }
    .marquee:before { left: 1.2%; }
    .marquee:after { right: 1.2%; }
    
    .marquee-track {
      display: flex;
      align-items: center;
      white-space: nowrap;
      min-width: max-content;
      animation: marquee 11s linear infinite;
      padding-left: 100%;
      font: 900 clamp(12px, 2.1vw, 32px)/1 Georgia, "Times New Roman", serif;
      letter-spacing: .11em;
      color: var(--gold);
      text-shadow: 0 2px 0 #5b3600, 0 0 10px #ffdf54;
      padding-right: 100%;
    }
    @keyframes marquee {
      to { transform: translateX(-100%); }
    }
    
    .door {
      position: absolute;
      z-index: 3;
      top: 39%;
      height: 39%;
      width: 16.8%;
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: transparent;
    }
  </style>
</head>
<body>

  <!-- Your marquee container and door elements go here -->
  <div class="marquee">
    <div class="marquee-track">Welcome to Hell what took you so long Chum?!</div>
  </div>

</body>
</html>
