<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Gallery Wall | Lunatic Fringe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        .header-container {
            text-align: center;
            background: linear-gradient(to bottom, #1a0000, #050505);
            padding: 25px 20px;
            border-bottom: 3px solid #b30000;
            box-shadow: 0 5px 25px rgba(179, 0, 0, 0.5);
        }

        .header-container h1 {
            color: #ff3333;
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            letter-spacing: 2px;
            margin: 0;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: center;
            justify-items: center;
        }

        .frame {
            background-color: #111;
            padding: 12px;
            border: 4px solid #b30000;
            box-shadow: 0 0 20px rgba(179, 0, 0, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 100%;
            box-sizing: border-box;
        }

        .frame:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
        }

        .frame img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #333;
        }

        .exit-container {
            text-align: center;
            padding: 40px 0;
        }

        .exit-btn {
            background-color: #b30000;
            color: #fff;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: bold;
            border: 2px solid #ff3333;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(179, 0, 0, 0.6);
            transition: background 0.2s, box-shadow 0.2s;
        }

        .exit-btn:hover {
            background-color: #ff3333;
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.9);
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>WELCOME TO THE DARK SIDE!? I SEEN SOME LIGHT SOMEWHERE? 😕</h1>
    </div>

    <div class="gallery-grid">
        <div class="frame">
            <!-- Replace src with your image path -->
            <img src="path_to_image_1.jpg" alt="Gallery picture 1">
        </div>
        <div class="frame">
            <!-- Replace src with your image path -->
            <img src="path_to_image_2.jpg" alt="Gallery picture 2">
        </div>
