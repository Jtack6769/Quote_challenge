<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Gallery Wall | Lunatic Fringe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      overflow-x: hidden;
    }
    .header-container {
      text-align: center;
      background: linear-gradient(to bottom, #1a0000, #050505);
      padding: 25px 20px;
      border-bottom: 3px solid #b30000;
      box-shadow: 0 5px 25px rgba(179, 0, 0, 0.5);
    }
    .header-container h1 {
      color: #ff3333;
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      letter-spacing: 2px;
      margin: 0;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 40px;
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: center;
      justify-items: center;
    }
    .frame {
      background-color: #111;
      padding: 12px;
      border: 4px solid #b30000;
      box-shadow: 0 0 20px rgba(179, 0, 0, 0.4), inset 0 0 10px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      max-width: 100%;
      box-sizing: border-box;
    }
    .frame:hover {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
    }
    .frame img {
      width: 100%;
      height: auto;
      display: block;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>The Gallery Wall</h1>
  </div>

  <div class="gallery-grid">
    <!-- Gallery frames will go here -->
  </div>

</body>
</html>
