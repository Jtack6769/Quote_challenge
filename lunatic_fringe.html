<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Gallery Wall | Lunatic Fringe</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}
body{margin:0;padding:40px 20px;min-height:100vh;color:#e8c9c9;font-family:Georgia,serif;background:#080608 url('image_17704fb6.jpg') center top / cover no-repeat fixed}
.fringe-banner{position:sticky;top:0;z-index:1000;margin:-40px -20px 32px;padding:15px 18px;text-align:center;background:linear-gradient(180deg,#880808,#240606 70%,#100709);border-bottom:4px ridge #880808;color:#f2b46a;text-shadow:0 0 12px #d31e1e;font-size:clamp(16px,3.5vw,30px);font-weight:bold;letter-spacing:.035em;box-shadow:0 8px 22px #000b,0 3px 18px #880808}
.wall-gallery{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:40px;max-width:1200px;margin:0 auto}
.hanging-frame{position:relative;padding:12px 12px 14px;background:#180707;border:8px ridge #880808;border-radius:4px;box-shadow:0 25px 35px rgba(0,0,0,.9),0 5px 18px #88080888;transform:rotate(var(--angle,0deg));transition:transform .3s ease;max-width:100%;cursor:zoom-in}
.hanging-frame:nth-child(odd){--angle:-1.5deg}.hanging-frame:nth-child(even){--angle:1.8deg}.hanging-frame:nth-child(3n){--angle:-.7deg}
.hanging-frame:hover,.hanging-frame:focus-visible{transform:rotate(0) scale(1.03);z-index:10;box-shadow:0 25px 35px #000,0 0 24px #880808}
.hanging-frame:focus-visible{outline:3px solid #f5c76c;outline-offset:7px}
.hanging-frame img{display:block;width:260px;max-width:100%;height:auto;min-height:180px;object-fit:contain;border:1px solid #880808;background:#000}
.missing-label{display:none;padding:15px;max-width:260px;color:#ffd6d6;font:14px/1.5 system-ui,sans-serif;overflow-wrap:anywhere}
.hanging-frame.missing{cursor:default}.hanging-frame.missing .missing-label{display:block}.hanging-frame.missing img{display:none}
dialog.viewer{border:8px ridge #880808;border-radius:5px;background:#100606;color:white;padding:15px;width:max-content;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);box-shadow:0 20px 50px #000,0 0 24px #880808}
dialog.viewer::backdrop{background:rgba(0,0,0,.9)}.viewer img{display:block;max-width:min(88vw,1100px);max-height:76vh;object-fit:contain}
.viewer .close{display:block;margin:0 0 12px auto;padding:7px 12px;background:#880808;border:1px solid #e7a5a5;color:#fff;font-size:17px;cursor:pointer}
.viewer .close:hover{background:#a50b0b}
.switch-area{display:flex;flex-direction:column;align-items:center;gap:12px;margin:70px auto 24px;text-align:center}
.exit-switch{width:112px;height:135px;border:7px ridge #880808;border-radius:8px;background:linear-gradient(140deg,#340b0b,#080808);box-shadow:0 12px 25px #000,0 0 16px #880808;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#f0c2b6;font:700 17px Georgia,serif}
.exit-switch .lever{display:block;width:34px;height:55px;border:4px ridge #999;background:linear-gradient(90deg,#333,#ddd 50%,#555);border-radius:6px;box-shadow:0 3px 8px #000;transition:transform .15s}
.exit-switch:active .lever{transform:translateY(6px)}.exit-switch:focus-visible{outline:3px solid #f5c76c;outline-offset:5px}
#sound-status{min-height:1.5em;color:#f0b9a9;font:14px system-ui,sans-serif}
@media(max-width:600px){body{padding:28px 16px}.fringe-banner{margin:-28px -16px 26px}.wall-gallery{gap:28px}.hanging-frame img{width:min(260px,72vw)}}
@media(prefers-reduced-motion:reduce){.hanging-frame,.exit-switch .lever{transition:none}}
</style>
</head>
<body>
<header class="fringe-banner">WELCOME TO THE DARK SIDE!? I SEEN SOME LIGHT SOMEWHERE? 😕</header>
<main class="wall-gallery" aria-label="Framed picture gallery">
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 1"><img src="gemini_remix_20261021_234409.jpg" alt="Gallery picture 1" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 2"><img src="gemini_remix_20261021_232243.jpg" alt="Gallery picture 2" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 3"><img src="image_eadaddeb.jpg" alt="Gallery picture 3" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 4"><img src="gemini_remix_20261021_232703.jpg" alt="Gallery picture 4" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 5"><img src="image_7e6db39.jpg" alt="Gallery picture 5" loading="lazy"><span class="missing-label"></span></div>
<div class="hanging-frame" tabindex="0" role="button" aria-label="Enlarge gallery picture 6"><img src="secret-portrait.png" alt="Gallery picture 6" loading="lazy"><span class="missing-label"></span></div>
</main>
<section class="switch-area" aria-label="Sound effect switch">
<button class="exit-switch" id="sound-switch" type="button" aria-label="Play surprise sound"><span>EXIT</span><span class="lever" aria-hidden="true"></span></button>
<div id="sound-status" role="status" aria-live="polite"></div>
</section>
<dialog class="viewer" aria-label="Enlarged gallery picture"><button class="close" type="button" aria-label="Close enlarged picture">Close ×</button><img alt="Enlarged gallery picture"></dialog>
<script>
const viewer=document.querySelector('.viewer');
const enlargedImage=viewer.querySelector('img');
const closeButton=viewer.querySelector('.close');
let lastFrame=null;
document.querySelectorAll('.hanging-frame').forEach(frame=>{
 const photo=frame.querySelector('img');
 const showMissing=()=>{frame.classList.add('missing');frame.querySelector('.missing-label').textContent='Picture not found: '+photo.getAttribute('src');frame.removeAttribute('role');frame.removeAttribute('tabindex');frame.removeAttribute('aria-label');};
 photo.addEventListener('error',showMissing);
 if(photo.complete&&photo.naturalWidth===0)showMissing();
 const open=()=>{if(frame.classList.contains('missing'))return;lastFrame=frame;enlargedImage.src=photo.currentSrc||photo.src;enlargedImage.alt=photo.alt;viewer.showModal();closeButton.focus();};
 frame.addEventListener('click',open);
 frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
});
closeButton.addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close();});
viewer.addEventListener('close',()=>{enlargedImage.removeAttribute('src');if(lastFrame)lastFrame.focus();});
const surpriseSound=new Audio('petergriffinstarwars.mp3');
document.getElementById('sound-switch').addEventListener('click',async()=>{
 const status=document.getElementById('sound-status');
 status.textContent='';
 try{surpriseSound.pause();surpriseSound.currentTime=0;await surpriseSound.play();}
 catch(error){console.error('Sound failed:',error);status.textContent='Sound unavailable. Check petergriffinstarwars.mp3 in this folder.';}
});
</script>
</body>
</html>
