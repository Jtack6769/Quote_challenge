<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Clock</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    main { text-align: center; padding: 2rem; }
    #time-display { font-size: clamp(2.5rem, 10vw, 6rem); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>Current Time</h1>
    <time id="time-display" aria-live="off">Loading…</time>
  </main>

  <script>
    'use strict';

    function updateClock() {
      const now = new Date();
      const timeDisplay = document.getElementById('time-display');
      if (!timeDisplay) return;

      timeDisplay.textContent = new Intl.DateTimeFormat(undefined, {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      }).format(now);
      timeDisplay.dateTime = now.toISOString();
    }

    updateClock();
    window.setInterval(updateClock, 1000);
  </script>
</body>
</html>
