<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction - Quote Challenge</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            border: 4px solid #ffcc00;
            padding: 40px;
            background-color: #141414;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #ff3333;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 2px 2px #ffcc00;
        }
        p {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .highlight {
            color: #ffcc00;
            font-weight: bold;
        }
        .arcade-btn {
            display: inline-block;
            background-color: #ff3333;
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #ffcc00;
            box-shadow: 4px 4px 0px #ffcc00;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .arcade-btn:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #ffcc00;
            background-color: #ff4d4d;
        }
        .footer-note {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Under Construction</h1>
        <p>The <span class="highlight">Quote Challenge</span> arcade is currently getting a major upgrade behind the scenes!</p>
        <p>Check back soon for new features, extra quotes, and a better gaming experience.</p>
        
        <a href="https://github.com/Jtack6769/Quote_challenge" class="arcade-btn" target="_blank">View on GitHub</a>

        <div class="footer-note">INSERT COIN TO CONTINUE...</div>
    </div>

</body>
</html>
