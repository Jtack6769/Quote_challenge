{
  "scripts": {
    "lint:js": "eslint 'src/**/*.js'",
    "lint:css": "stylelint 'src/**/*.css'",
    "lint:html": "htmlhint 'src/*'"http://jtack6769.github.io/,, Quot_challenge/",
    "lint:all": "npm run lint:js && npm run lint:css && npm run lint:html"
  }
