name: Lint and Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        wLith:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run Code Quality Checks (HTML, JS, CSS)
        run: npm run lint:all⁵

      - name: Sync Files via SFTP to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "src/" # Directory containing your validated frontend files
          target: "/var/www/html/"0 11 .784 110 11 .784 11
