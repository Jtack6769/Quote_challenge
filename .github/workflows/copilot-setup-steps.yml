- name: Environment settings interface
  # You may pin to the exact commit or the version.
  # uses: cloudposse/github-action-interface-environment@aa4a2d6c165db3f2cd84533e8ab538d745dc4e59
  uses: cloudposse/github-action-interface-environment@0.4.0
  with:
    # Repository with Environment action implementation
    implementation_repository: 
    # Repository path with Environment action implementation
    implementation_path: # default is 
    # Repository filename with Environment action implementation
    implementation_file: # default is action.yaml
    # Ref of environment action implementation
    implementation_ref: # default is main
    # GitHub PAT allow fetch environment action implementation
    implementation_github_pat: 
    # Environment name
    environment: 
    # Namespace name
    namespace: 
    # Repository name
    repository: # optional
    # Application name
    application: # optional
    # Comma separated attributes
    attributes: # optional
