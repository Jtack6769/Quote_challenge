# Upload to .github/workflows/running.yml on the default branch.
# Daily at 12:37 UTC (7:37 AM EST / 8:37 AM EDT), plus manual Run workflow.
# Reports: Actions > Quote Challenge Daily Scanner > latest run.
# For GitHub email: Settings > Notifications > Actions > Email; allow successful runs too.
- name: Setup Go environment
  uses: actions/setup-go@v7.1.0
name: Quote Challenge Daily Scanner
'on': Quote _challenge
  workflow_dispatch: null
  schedule:
  - cron: 37 12 * * *
permissions:
  contents: read
concurrency:
  group: qc-daily-scanner-${{ github.ref }}
  cancel-in-progress: false
env:
  QC_SITE_URL: ${{ vars.QC_SITE_URL || 'https://jtack6769.github.io/Quote_challenge/' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
    - name: Prepare report folder
      run: |
        mkdir -p "$RUNNER_TEMP/qc-report"
        echo "QC_REPORT_DIR=$RUNNER_TEMP/qc-report" >> "$GITHUB_ENV"
    - name: Checkout website
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install isolated scanner tools
      id: tools
      run: |
        mkdir -p "$RUNNER_TEMP/qc-scanner" "$QC_REPORT_DIR"
        npm install --prefix "$RUNNER_TEMP/qc-scanner" --ignore-scripts --no-audit --no-fund eslint@9.39.1 stylelint@16.25.0 htmlhint@1.6.3 parse5@7.3.0 playwright@1.56.1
    - name: Scan code, JSON and local references
      id: code
      continue-on-error: true
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      run: "cat > \"$RUNNER_TEMP/qc-scanner/scan.cjs\" <<'SCANNER'\nconst fs = require('node:fs');\nconst path =\
        \ require('node:path');\nconst { execFileSync } = require('node:child_process');\nconst { Linter } = require('eslint');\n\
        const { HTMLHint } = require('htmlhint');\nconst parse5 = require('parse5');\n\nasync function main() {\n\
        \  const stylelint = (await import('stylelint')).default;\n  const root = process.env.GITHUB_WORKSPACE;\n\
        \  if (!root) throw new Error('GITHUB_WORKSPACE is required');\n  const files = execFileSync('git', ['ls-files',\
        \ '-z'], { cwd: root, encoding: 'utf8' })\n    .split('\\0').filter(Boolean).filter(file =>\n      /\\.(?:html?|[cm]?js|css|json)$/i.test(file)\
        \ &&\n      !/(^|\\/)(?:node_modules|vendor|\\.git|_site)\\//.test(file) &&\n      !/\\.min\\.(?:js|css)$/i.test(file));\n\
        \  const findings = [];\n  const counts = { html: 0, javascript: 0, css: 0, json: 0, references: 0 };\n\
        \  const tracked = new Set(execFileSync('git', ['ls-files', '-z'], { cwd: root, encoding: 'utf8' }).split('\\\
        0').filter(Boolean));\n  const linter = new Linter();\n  function add(file, line, column, message) {\n \
        \   findings.push({ file, line: Math.max(1, line || 1), column: Math.max(1, column || 1), message });\n\
        \  }\n  function js(code, file, sourceType = 'module', offset = 0) {\n    counts.javascript++;\n    for\
        \ (const item of linter.verify(code, {\n      languageOptions: { ecmaVersion: 'latest', sourceType },\n\
        \      linterOptions: { noInlineConfig: true },\n      rules: { 'no-dupe-args': 'error', 'no-dupe-keys':\
        \ 'error', 'valid-typeof': 'error' }\n    })) add(file, offset + (item.line || 1), item.column, item.message);\n\
        \  }\n  async function css(code, file, offset = 0) {\n    counts.css++;\n    const result = await stylelint.lint({\n\
        \      code, codeFilename: path.join(root, 'qc-inline.css'),\n      config: { rules: { 'block-no-empty':\
        \ true, 'color-no-invalid-hex': true } }\n    });\n    for (const item of result.results) {\n      for (const\
        \ warning of item.warnings || [])\n        add(file, offset + (warning.line || 1), warning.column, warning.text);\n\
        \      for (const error of item.parseErrors || [])\n        add(file, offset + (error.line || 1), error.column,\
        \ error.text);\n    }\n  }\n  async function html(code, file) {\n    counts.html++;\n    for (const item\
        \ of HTMLHint.verify(code, {\n      'attr-no-duplication': true, 'id-unique': true,\n      'tag-pair': true,\
        \ 'attr-value-double-quotes': false\n    })) add(file, item.line, item.col, item.message);\n    const document\
        \ = parse5.parse(code, { sourceCodeLocationInfo: true });\n    const hasBase = /<base\\s/i.test(code);\n\
        \    async function visit(node) {\n      const location = node.sourceCodeLocation;\n      const attributes\
        \ = Object.fromEntries((node.attrs || []).map(a => [a.name, a.value]));\n      // Relative links only; root-relative\
        \ links can point to other GitHub Pages repos.\n      if (!hasBase) for (const key of ['href', 'src', 'poster'])\
        \ {\n        const value = attributes[key];\n        if (!value || /^(?:[a-z][a-z0-9+.-]*:|[/#?{])/i.test(value)\
        \ || value.includes('{{')) continue;\n        counts.references++;\n        try {\n          const pathname\
        \ = decodeURIComponent(value.split(/[?#]/)[0]);\n          if (!pathname) continue;\n          const target\
        \ = path.posix.normalize(path.posix.join(path.posix.dirname(file), pathname));\n          if (target.startsWith('../'))\
        \ continue;\n          const candidates = [target, path.posix.join(target, 'index.html')];\n          if\
        \ (!candidates.some(p => tracked.has(p))) add(file, location?.startLine, 1, `Missing local ${key}: ${value}`);\n\
        \        } catch (error) { add(file, location?.startLine, 1, `Invalid local URL: ${value}`); }\n      }\n\
        \      if (node.tagName === 'script' && /^(application\\/(ld\\+)?json|importmap)$/.test(attributes.type\
        \ || '')) {\n        try { JSON.parse((node.childNodes || []).map(n => n.value || '').join('')); }\n   \
        \     catch (error) { add(file, location?.startLine, 1, `Invalid inline JSON: ${error.message}`); }\n  \
        \    }\n      if (location && location.startTag && /^(script|style)$/.test(node.tagName)) {\n        const\
        \ attrs = Object.fromEntries((node.attrs || []).map(a => [a.name, a.value]));\n        const start = location.startTag.endOffset;\n\
        \        const end = location.endTag ? location.endTag.startOffset : location.endOffset;\n        // Preserve\
        \ columns on the opening-tag line and original file line numbers.\n        const body = ' '.repeat(location.startTag.endCol\
        \ - 1) + code.slice(start, end);\n        const offset = location.startTag.endLine - 1;\n        const type\
        \ = (attrs.type || '').trim().toLowerCase().split(';')[0];\n        if (node.tagName === 'style' && (!type\
        \ || type === 'text/css')) await css(body, file, offset);\n        if (node.tagName === 'script' && !('src'\
        \ in attrs) &&\n            ['', 'module', 'text/javascript', 'application/javascript', 'text/ecmascript',\
        \ 'application/ecmascript'].includes(type))\n          js(body, file, type === 'module' ? 'module' : 'script',\
        \ offset);\n      }\n      for (const child of node.childNodes || []) await visit(child);\n      if (node.content)\
        \ await visit(node.content);\n    }\n    await visit(document);\n  }\n  for (const file of files) {\n  \
        \  const absolute = path.join(root, file);\n    // Never follow repository symlinks to files outside the\
        \ checkout.\n    if (!fs.lstatSync(absolute).isFile()) continue;\n    const code = fs.readFileSync(absolute,\
        \ 'utf8');\n    if (/\\.html?$/i.test(file)) await html(code, file);\n    else if (/\\.css$/i.test(file))\
        \ await css(code, file);\n    else if (/\\.json$/i.test(file)) { counts.json++; try { JSON.parse(code);\
        \ } catch (error) { add(file, 1, 1, `Invalid JSON: ${error.message}`); } }\n    else js(code, file, /\\\
        .cjs$/i.test(file) ? 'commonjs' : 'module');\n  }\n  const escapeData = value => String(value).replace(/%/g,\
        \ '%25').replace(/\\r/g, '%0D').replace(/\\n/g, '%0A');\n  const escapeProperty = value => escapeData(value).replace(/:/g,\
        \ '%3A').replace(/,/g, '%2C');\n  findings.forEach((item, index) => {\n    if (index < 50) console.log(`::error\
        \ file=${escapeProperty(item.file)},line=${item.line},col=${item.column}::${escapeData(item.message)}`);\n\
        \    else console.log(JSON.stringify(item));\n  });\n  const summary = [\n    '# Quote Challenge code scan',\
        \ '',\n    `Checked ${counts.html} HTML files, ${counts.javascript} JavaScript files/blocks, and ${counts.css}\
        \ CSS files/blocks; ${counts.json} JSON files and ${counts.references} local references.`, '',\n    `Found\
        \ ${findings.length} issue(s).`, '',\n    'Checks tracked HTML, JavaScript, and CSS, including script/style\
        \ blocks inside HTML. Skips vendor folders, node_modules, _site, symlinks, and *.min.js/*.min.css.', '',\n\
        \    'Static checks do not test button behavior, external links, CSS url() references, srcset, inline event\
        \ attributes, or server-side templates. Relative references on pages using a base tag are skipped. JSON\
        \ must be strict JSON. It does not change files or deploy the website.', ''\n  ];\n  for (const item of\
        \ findings.slice(0, 100)) summary.push(`- ${JSON.stringify(item.file)}:${item.line}:${item.column} \u2014\
        \ ${item.message.replace(/[\\r\\n]/g, ' ')}`);\n  if (findings.length > 100) summary.push('', 'Additional\
        \ issues are listed in the scan log.');\n  console.log(`Checked ${files.length} candidate files; found ${findings.length}\
        \ issue(s).`);\n  if (!files.length) { summary.push('', 'ERROR: No supported tracked files found.'); process.exitCode\
        \ = 1; }\n  fs.mkdirSync(process.env.QC_REPORT_DIR, { recursive: true });\n  fs.writeFileSync(path.join(process.env.QC_REPORT_DIR,\
        \ 'code-report.md'), summary.join('\\n') + '\\n');\n  fs.writeFileSync(path.join(process.env.QC_REPORT_DIR,\
        \ 'code-report.json'), JSON.stringify({ counts, findings }, null, 2));\n  if (findings.length) process.exitCode\
        \ = 1;\n}\nmain().catch(error => { console.error(error); process.exitCode = 1; });\nSCANNER\nnode \"$RUNNER_TEMP/qc-scanner/scan.cjs\"\
        \n"
    - name: Install Chromium
      id: browser_install
      if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
      run: |
        node "$RUNNER_TEMP/qc-scanner/node_modules/playwright/cli.js" install --with-deps chromium
    - name: Check live pages in Chromium
      id: browser
      continue-on-error: true
      if: ${{ !cancelled() && steps.browser_install.outcome == 'success' }}
      timeout-minutes: 6
      run: |
        cat > "$RUNNER_TEMP/qc-scanner/browser.cjs" <<'BROWSER'
        const fs = require('node:fs');
        const path = require('node:path');
        const { chromium } = require('playwright');
        async function main() {
          const out = process.env.QC_REPORT_DIR;
          fs.mkdirSync(out, {recursive: true});
          const base = new URL(process.env.QC_SITE_URL);
          if (!base.pathname.endsWith('/')) base.pathname += '/';
          const pages = ['', 'one-player.html', 'two-player.html', 'next.html', 'bonus.html'];
          const findings = [], checks = [];
          const browser = await chromium.launch();
          try {
            for (const file of pages) {
              if (file && !fs.existsSync(path.join(process.env.GITHUB_WORKSPACE, file))) {
                checks.push({file, status: 'SKIPPED: page absent from checkout'}); continue;
              }
              const context = await browser.newContext({ viewport: { width: 1280, height: 800 } });
              const page = await context.newPage();
              const url = new URL(file, base).href;
              const observed = new Set();
              const add = (level, message) => {
                const key = level + message;
                if (!observed.has(key)) findings.push({file: file || 'index.html', level, message});
                observed.add(key);
              };
              page.on('pageerror', error => add('error', 'Uncaught JavaScript: ' + error.message));
              page.on('response', response => {
                if (response.status() >= 400) {
                  const local = new URL(response.url()).origin === base.origin;
                  add(local ? 'error' : 'warning', `HTTP ${response.status()}: ${response.url()}`);
                }
              });
              page.on('requestfailed', request => {
                const reason = request.failure()?.errorText || 'Unknown';
                if (!reason.includes('ERR_ABORTED')) add('warning', `Request failed: ${request.url()} (${reason})`);
              });
              try {
                let response;
                for (let attempt = 0; attempt < 3; attempt++) {
                  try {
                    response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 25000 });
                    if (response && response.status() < 500) break;
                  } catch (error) { if (attempt === 2) throw error; }
                }
                if (!response || !response.ok()) add('error', `Page unavailable: ${response?.status() || 'no response'}`);
                // Short observation window catches startup errors without waiting on looping media.
                await page.waitForTimeout(2500);
                const title = await page.title();
                if (!title.trim()) add('warning', 'Missing page title');
                const body = await page.locator('body').innerText({timeout: 5000});
                if (!body.trim()) add('warning', 'No visible text; inspect screenshot');
                const images = await page.locator('img').evaluateAll(nodes => nodes.filter(n => n.complete && n.currentSrc && !n.naturalWidth).map(n => n.currentSrc));
                for (const image of images) add('warning', 'Broken image: ' + image);
                await page.screenshot({ path: path.join(out, (file || 'index.html').replace(/\.html$/, '') + '-desktop.png'), fullPage: false, timeout: 10000 });
                await page.setViewportSize({width: 390, height: 844});
                await page.screenshot({ path: path.join(out, (file || 'index.html').replace(/\.html$/, '') + '-phone.png'), fullPage: false, timeout: 10000 });
                checks.push({file: file || 'index.html', url, status: response?.status(), title});
              } catch (error) { add('error', 'Browser check failed: ' + error.message); }
              await context.close();
            }
          } finally { await browser.close(); }
          fs.writeFileSync(path.join(out, 'browser-report.json'), JSON.stringify({checks, findings}, null, 2));
          const lines = ['# Live browser checks', '', ...checks.map(c => '- ' + JSON.stringify(c)), '', ...findings.map(f => '- ' + f.level.toUpperCase() + ': ' + JSON.stringify(f))];
          lines.push('', 'Checks published pages, startup errors and loading resources. Does not click buttons, submit forms, check scoring or test gameplay. Screenshots are desktop and phone viewport snapshots in Chromium, not real phone device tests. External resource errors are warnings. A transient HTTP error during retry remains recorded for review.');
          fs.writeFileSync(path.join(out, 'browser-report.md'), lines.join('\n'));
          if (findings.some(f => f.level === 'error')) process.exitCode = 1;
        }
        main().catch(error => { console.error(error); process.exitCode = 1; });
        BROWSER
        node "$RUNNER_TEMP/qc-scanner/browser.cjs"
    - name: Write daily report even after failure
      if: ${{ always() }}
      env:
        TOOLS: ${{ steps.tools.outcome }}
        CODE: ${{ steps.code.outcome }}
        BROWSER_INSTALL: ${{ steps.browser_install.outcome }}
        BROWSER: ${{ steps.browser.outcome }}
      run: |
        python3 - <<'REPORT'
        import json, os
        from pathlib import Path
        out = Path(os.environ['QC_REPORT_DIR'])
        out.mkdir(parents=True, exist_ok=True)
        statuses = {k: os.environ.get(k, 'unknown') for k in ['TOOLS', 'CODE', 'BROWSER_INSTALL', 'BROWSER']}
        passed = all(s == 'success' for s in statuses.values())
        run = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
        lines = ['# Quote Challenge Daily Scanner', '', '**' + ('PASS' if passed else 'NEEDS ATTENTION') + '**', '', 'Run: ' + run, '', 'Commit: ' + os.environ['GITHUB_SHA'], '', '| Stage | Result |', '| --- | --- |']
        lines += ['| ' + key + ' | ' + value + ' |' for key, value in statuses.items()]
        lines += ['', 'A failed setup is a scanner problem; findings in code/browser reports are website problems. Skipped checks are not a pass. Checkout code and published pages may differ if deployment is pending.', '']
        for name in ['code-report.md', 'browser-report.md']:
            p = out / name
            lines += [p.read_text() if p.exists() else '**Missing ' + name + ': this stage did not finish. See the run log.**', '']
        lines += ['Reports and screenshots are in the downloadable qc-daily-report artifact. The workflow does not edit website files or deploy anything.', '']
        text = '\n'.join(lines)
        (out / 'daily-report.md').write_text(text)
        (out / 'run-status.json').write_text(json.dumps({'passed': passed, 'stages': statuses, 'run': run}, indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(text[:950000])
        REPORT
    - name: Save reports and screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: qc-daily-report-${{ github.run_number }}-${{ github.run_attempt }}
        path: ${{ env.QC_REPORT_DIR }}
        retention-days: 30
        if-no-files-found: error
